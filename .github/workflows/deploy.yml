# Checks, tests, builds and publishes the site to GitHub Pages on every push to main.
# The repository's Pages source must be set to "GitHub Actions" (Settings, Pages).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The linter is its own package, with its own dependencies (tools/lint/eslint.config.js says why).
      - run: npm ci --prefix tools/lint
      # A failing check stops the deployment: nothing is published that the formatter, the linter or the tests reject.
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
