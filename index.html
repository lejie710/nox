    <script>
      // Motion gate, decided before first paint. Static when ?static is in the
      // URL, when the reader prefers reduced motion, or when the browser lacks
      // scroll-driven animations. The static page shows each scene's end state.
      (function () {
        var p = new URLSearchParams(location.search);
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var supports = window.CSS && CSS.supports("animation-timeline: view()");
        document.documentElement.classList.add(!p.has("static") && !reduce && supports ? "enhanced" : "static");
        // Chapters need no scroll-driven animations, only the reader's consent
        // to motion: they go still only for ?static or reduced motion.
        if (p.has("static") || reduce) document.documentElement.classList.add("still");
      })();
    </script>
